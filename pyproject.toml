[tool.poetry]
name = "normpare"
version = "0.1.1"
description = "Compare two editions of a technical standard: changes, per-chapter summaries and a synopsis — deterministic, plus optional AI interpretation."
authors = ["Christian Ehlert <christian.ehlert@mailbox.org>"]
license = "MIT"
homepage = "https://github.com/Ce1ectric/normpare"
repository = "https://github.com/Ce1ectric/normpare"
documentation = "https://ce1ectric.github.io/normpare/"
readme = "README.md"
keywords = ["standards", "standard", "diff", "compare", "synopsis", "regulatory", "docx", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering",
]
packages = [{ include = "normpare", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
lxml = "^5.0"
pymupdf = "^1.24"
numpy = "^2.1"
scipy = "^1.14"
python-docx = "^1.1"
python-pptx = "^1.0"
# Optionale Zusatzpakete (siehe [tool.poetry.extras]):
anthropic = { version = ">=0.40,<1.0", optional = true }
sentence-transformers = { version = "^3.0", optional = true }
einops = { version = "^0.8", optional = true }

[tool.poetry.extras]
# Nur nötig für den Provider "anthropic":
anthropic = ["anthropic"]
# Embedding-Rettungspass (ADR-0001), standardmäßig aus:
embeddings = ["sentence-transformers", "einops"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
black = "^24.8"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = { extras = ["python"], version = "^0.26" }
pymdown-extensions = "^10.9"

[tool.poetry.scripts]
normpare = "normpare.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
